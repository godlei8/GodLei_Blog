# 生产环境配置（启用方式：SPRING_PROFILES_ACTIVE=prod）
#
# 原则：本文件会进入版本库，严禁写入任何明文密钥。
# 以下敏感信息一律通过环境变量注入（在 docker run -e 或 backend.env 中提供）：
#   HM_DB_PASSWORD          数据库密码
#   COS_SECRET_ID           腾讯云 COS 访问密钥 ID（上传新图所需）
#   COS_SECRET_KEY          腾讯云 COS 访问密钥 Key
#   BLOG_ASSISTANT_API_KEY  AI 助手模型密钥（馨宝对话所需）
#
# COS 的桶/地域/公网域名/前缀等非敏感默认值见 application.yml，
# 可分别用 COS_BUCKET / COS_REGION / COS_PUBLIC_BASE_URL / COS_PREFIX 覆盖。

spring:
  datasource:
    url: jdbc:mysql://${HM_DB_HOST:mysql}:3306/godleiblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${HM_DB_USERNAME:root}
    password: ${HM_DB_PASSWORD}

# 生产环境上传固定走腾讯云 COS（密钥经环境变量注入；其余默认值继承 application.yml）
upload:
  provider: ${UPLOAD_PROVIDER:cos}
  dir: ${UPLOAD_DIR:/opt/godleiblog/uploads}
