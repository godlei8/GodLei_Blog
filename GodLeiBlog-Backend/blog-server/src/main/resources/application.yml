#TODO部署后要改配置
#配置数据库的连接信息
spring:
  application:
    name: blog-server
  #数据库的链接信息
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/godleiblog
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.password}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

#mybatis的相关配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #开启驼峰命名映射
    map-underscore-to-camel-case: true
  # 添加Mapper位置配置
  mapper-locations: classpath*:cn/godlei/blogserver/mapper/*.xml
  type-aliases-package: cn.godlei.blogpojo.entity

# PageHelper分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: pageNum=pageNum;pageSize=pageSize;

# 服务器端口配置
server:
  port: 8080

blog:
  assistant:
    enabled: ${BLOG_ASSISTANT_ENABLED:true}
    provider: ${BLOG_ASSISTANT_PROVIDER:deepseek}
    base-url: ${BLOG_ASSISTANT_BASE_URL:}
    api-key: ${BLOG_ASSISTANT_API_KEY:${OPENAI_API_KEY:${MINIMAX_API_KEY:}}}
    model: ${BLOG_ASSISTANT_MODEL:deepseek-v4-pro}
    temperature: ${BLOG_ASSISTANT_TEMPERATURE:0.7}
    top-p: ${BLOG_ASSISTANT_TOP_P:0.95}
    max-tokens: ${BLOG_ASSISTANT_MAX_TOKENS:}
    connect-timeout-ms: ${BLOG_ASSISTANT_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${BLOG_ASSISTANT_READ_TIMEOUT_MS:120000}
    max-requests-per-minute: ${BLOG_ASSISTANT_MAX_REQUESTS_PER_MINUTE:12}
    max-input-chars: ${BLOG_ASSISTANT_MAX_INPUT_CHARS:16000}

# 上传/对象存储配置（secret 走环境变量或本地 application-local.yml，勿入库）
upload:
  provider: ${UPLOAD_PROVIDER:cos}                  # local 本地磁盘 / cos 腾讯云对象存储
  dir: ${UPLOAD_DIR:./uploads}                      # provider=local 时的本地目录
  max-image-size: ${UPLOAD_MAX_IMAGE_SIZE:5MB}      # 单图大小上限
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    bucket: ${COS_BUCKET:godlei-1311686380}
    region: ${COS_REGION:ap-chengdu}
    public-base-url: ${COS_PUBLIC_BASE_URL:http://cos.godlei8.top}
    prefix: ${COS_PREFIX:blog}
